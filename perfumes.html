<!DOCTYPE html>

<head>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: #121212; color: #ffffff; }
        .encabezado { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 30px auto; border-bottom: 1px solid #2d2d2d; padding-bottom: 15px; }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 1px; text-transform: uppercase; }
        .boton-volver { background: #1e1e1e; color: #aaaaaa; text-decoration: none; padding: 8px 16px; border-radius: 8px; border: 1px solid #2d2d2d; font-size: 0.9rem; font-weight: 600; transition: all 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .boton-volver:hover, .boton-volver:active { border-color: #ffffff; color: #ffffff; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .contenedor-productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .tarjeta { background: #1e1e1e; padding: 15px; border-radius: 14px; border: 1px solid #2d2d2d; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.3s ease; }
        .tarjeta:hover { border-color: rgba(255,255,255,0.3); box-shadow: 0 0 12px rgba(255,255,255,0.1); transform: translateY(-4px); }
        .tarjeta img { width: 100%; height: 250px; object-fit: contain; background-color: #151515; border-radius: 10px; }
        h3 { font-size: 1.2rem; margin: 15px 0 5px 0; color: #ffffff; }
        p { color: #aaaaaa; font-size: 0.95rem; line-height: 1.4; margin: 0 0 10px 0; }
        .precio { font-size: 1.4rem; font-weight: bold; color: #2ecc71; margin: 12px 0; }
        .boton-whatsapp { display: flex; align-items: center; justify-content: center; gap: 8px; background-color: #25d366; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; box-shadow: 0 3px 8px rgba(37, 211, 102, 0.2); transition: background-color 0.2s, box-shadow 0.2s; -webkit-tap-highlight-color: transparent; }
        .boton-whatsapp:hover, .boton-whatsapp:active { background-color: #20ba5a; box-shadow: 0 5px 12px rgba(37, 211, 102, 0.4); }
    </style>
